<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسینیه زینبیه شهردراز</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      line-height: 1.9;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      color: #ddd;
      font-size: 15px;
    }

    nav {
      background: #222;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      position: sticky;
      top: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 8px;
    }

    nav a:hover {
      background: #444;
    }

    .hero {
      min-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #111, #333);
      color: white;
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #ddd;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    section {
      background: white;
      margin-bottom: 25px;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    section h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      padding: 20px;
      background: #f7f7f7;
      border-radius: 12px;
      text-align: center;
    }

    footer {
      background: #111;
      color: #ccc;
      text-align: center;
      padding: 25px 15px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .hero h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>حسینیه زینبیه شهردراز</h1>
